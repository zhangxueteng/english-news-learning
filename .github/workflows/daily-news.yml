name: Update daily English news
on:
  schedule:
    - cron: "15 22 * * *" # 06:15 in UTC+8
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-news-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate graded learning content
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        run: python scripts/update_news.py
      - name: Commit updated news
        run: |
          if git diff --quiet -- data/news.json; then
            echo "No news changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit -m "chore: update daily English news"
          git push
